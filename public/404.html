<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found · Deep Shah Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030d14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      padding: 40px;
      border: 1px solid rgba(0, 206, 209, 0.2);
      border-radius: 16px;
      background: rgba(10, 25, 35, 0.6);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #00ced1;
      background: rgba(0, 206, 209, 0.1);
      border: 1px solid rgba(0, 206, 209, 0.3);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #00CED1, #008B8B, #20B2AA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #00CED1, #008B8B);
      color: #030d14;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    a.btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 206, 209, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">404 Error</div>
    <h1>404</h1>
    <p>The technical node or document you are looking for does not exist or has been relocated.</p>
    <a href="/" class="btn">Return to Portfolio →</a>
  </div>
</body>
</html>
